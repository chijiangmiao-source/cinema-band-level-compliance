name: cinema-sound

services:
  api:
    build: .
    image: cinema-sound-api:latest
    ports:
      # Host port is overridable: API_PORT=9000 docker compose up
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
